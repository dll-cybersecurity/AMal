<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMal - Anti-Malware Indicator Feed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #2c3e50, #000000);
        }

        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            margin-bottom: 0;
        }

        p {
            color: #aaa;
            margin-top: 0;
        }

        input[type="text"] {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #0069d9;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .buttons button {
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AMal</h1>
        <p>Anti-Malware Indicator Feed</p>
        <p>Check if your website is safe:</p>
        <input type="text" placeholder="Enter an IP">
        <div class="buttons">
            <button>Get started</button>
            <button>Documentation</button>
        </div>
    </div>
</body>
</html>
